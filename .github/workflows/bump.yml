name: Weekly package version bump

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-maintenance
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bump package versions
        run: python -u scripts/bump.py --bump

      - name: Commit updated recipes
        shell: bash
        run: |
          git add -- 'packages/*/template/APGBUILD'
          if git diff --cached --quiet; then
            echo "No package version changes."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: bump package versions"
          git pull --rebase
          git push
